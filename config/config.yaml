project:
  name: customer-churn-decision-intelligence
  dataset: IBM Telco Customer Churn

paths:
  raw_data: data/raw
  raw_dataset_file: data/raw/Telco_customer_churn.xlsx
  interim_data: data/interim
  validated_dataset_file: data/interim/Telco_customer_churn_validated.xlsx
  processed_data: data/processed
  artifacts: artifacts
  reports: reports
  profile_report: reports/data_profile.md
  validation_report: reports/validation_results.json

runtime:
  random_seed: 42
  log_level: INFO
  total_charges_column: Total Charges

schema:
  target_column: Churn Label

  identifier_columns:
    - CustomerID

  leakage_columns:
    - Churn Value
    - Churn Score
    - Churn Reason

  required_columns:
  - Churn Label
  - Monthly Charges
  - Total Charges
  - Tenure Months

  # Semantic column mapping consumed by BusinessEDA (analysis-only).
  # Maps logical business roles to actual dataset column names so the
  # analysis layer never hardcodes dataset schema.
  eda:
    churn_column: Churn Label
    positive_churn_value: "Yes"
    monthly_charges_column: Monthly Charges
    total_charges_column: Total Charges
    tenure_column: Tenure Months
    contract_column: Contract
    month_to_month_value: Month-to-month
    service_columns:
      - Phone Service
      - Multiple Lines
      - Internet Service
      - Online Security
      - Online Backup
      - Device Protection
      - Tech Support
      - Streaming TV
      - Streaming Movies
    segment_columns:
      - Senior Citizen
      - Partner
      - Dependents
      - Paperless Billing
      - Payment Method

  # Semantic mapping consumed by FeatureEngineer (feature layer).
  # Additive and analysis-side only; downstream ML modules read from here.
  features:
    tenure_column: Tenure Months
    contract_column: Contract
    monthly_charges_column: Monthly Charges
    total_charges_column: Total Charges
    cltv_column: CLTV
    service_columns:
      - Phone Service
      - Multiple Lines
      - Internet Service
      - Online Security
      - Online Backup
      - Device Protection
      - Tech Support
      - Streaming TV
      - Streaming Movies
    # Values that indicate a service is NOT subscribed.
    non_service_values:
      - "No"
      - No phone service
      - No internet service
    # Ordinal commitment strength per contract type.
    contract_commitment_scores:
      Month-to-month: 0
      One year: 1
      Two year: 2

# Retention recommendation catalog (config-driven).
# personas: fixed playbook actions per persona (segment strategy).
# driver_rules: actions triggered when a readable churn driver contains `match`
# (individual precision). The two are merged into a hybrid recommendation.
recommendations:
  personas:
    High-Value At-Risk:
      - Priority retention call from a success manager
      - Targeted loyalty discount
    High-Value Loyal:
      - Proactive value check-in and upsell review
    Low-Value At-Risk:
      - Automated retention email with incentive
    Low-Value Stable:
      - Standard lifecycle nurture
  driver_rules:
    - match: "Contract = Month-to-month"
      action: Offer a discounted annual contract
    - match: "Tech Support"
      action: Bundle complimentary tech support
    - match: "Online Security"
      action: Offer a free online-security trial
    - match: "Monthly Charges"
      action: Review the plan for cost optimization
    - match: "Tenure Months"
      action: Enroll in an early-tenure onboarding program
    - match: "Payment Method"
      action: Encourage switching to automatic payment
